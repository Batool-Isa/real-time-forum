<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/assets/css/styles.css" defer />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css" />
  <title>Forum</title>
</head>

<body>
  <header class="header">
    <div class="header__container">
      <img src="#" alt="" class="header__img" id="profile-pic" style="display: none" />
      <a class="header__logo">Real Time Forum</a>
      <span id="logged-user-name" class="header__username"></span>
      <div class="header__toggle">
        <i class="bx bx-menu" id="header-toggle"></i>
      </div>
    </div>
  </header>

  <div class="nav" id="navbar">
    <nav class="nav__container">
      <div>
        <a class="nav__link nav__logo">
          <i class="bx bx-chat nav__icon"></i>
          <span class="nav__logo-name">Real Time Forum</span>
        </a>
        <div class="nav__list">
          <div class="nav__items">
            <a href="#" class="nav__link active" data-path="/">
              <i class="bx bx-home nav__icon"></i>
              <span class="nav__name">Home</span>
            </a>
            <a href="#" class="nav__link" data-path="/create">
              <i class="bx bx-edit nav__icon"></i>
              <span class="nav__name">Create Post</span>
            </a>
            <a href="#" class="nav__link" data-path="/chat">
              <i class="bx bx-message-square-dots nav__icon"></i>
              <span class="nav__name">Chat</span>
            </a>
            <a href="#" class="nav__link" data-path="/logout">
              <i class="bx bx-log-out nav__icon"></i>
              <span class="nav__name">Log Out</span>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </div>
  <main>
    <!-- Home Page Content-->
    <div class="home">

      <section class="posts" id="posts-container">

      </section>

      <!--pagination Section-->
      <div class="pagination">
        <button class="pagination__prev" disabled>Previous</button>
        <span class="pagination__info">Page 1 of 10</span>
        <button class="pagination__next">Next</button>
      </div>
    </div>

    <!-- Cireate Post Page Content-->
    <section class="create-post">
      <h2 class="section-title">Create a New Post</h2>
      <form action="/create" method="post" class="create-post-form" id="create-post-form">
        <div class="form-group">
          <label for="post-content">Content:</label>
          <textarea id="post-content" name="content" rows="10" minlength="1" maxlength="2500"
            style="white-space: pre-line" required></textarea>
        </div>
        <div class="form-group">
          <label for="post-category">Category:</label>
          <div id="post-category" class="checkbox-group">
            <input type="checkbox" id="category-sports" name="category" value="Sports">
            <label for="category-sports">Sports</label>
            <input type="checkbox" id="category-technology" name="category" value="Technology">
            <label for="category-technology">Technology</label>
            <input type="checkbox" id="category-education" name="category" value="Education">
            <label for="category-education">Education</label>
            <input type="checkbox" id="category-health" name="category" value="Health">
            <label for="category-health">Health</label>
            <input type="checkbox" id="category-entertainment" name="category" value="Entertainment">
            <label for="category-entertainment">Entertainment</label>
            <input type="checkbox" id="category-travel" name="category" value="Travel">
            <label for="category-travel">Travel</label>
            <input type="checkbox" id="category-finance" name="category" value="Finance">
            <label for="category-finance">Finance</label>
            <input type="checkbox" id="category-culture" name="category" value="Culture">
            <label for="category-culture">Culture</label>
          </div>
          <div id="error-message" style="color:red; display:none;">Please select at least one category.</div>
        </div>
        <button type="submit" class="submit-button">Create Post</button>

      </form>
    </section>

  </main>
  <!-- Footer Section -->

  <footer class="footer">
    <p class="footer-text">All rights reserved &copy; 2024 Reboot</p>
  </footer>

  <script src="/assets/js/main.js"></script>
</body>
<div class="chat-container" style="display: none;">
  <div class="chat-users">
    <div class="chat-users-header">
      <h3>Chats</h3>
    </div>
    <div class="users-list">
      <!-- Users will be populated dynamically -->
    </div>
  </div>

  <div class="chat-messages">
    <div class="chat-header">
      <span class="current-chat-user">Select a user to start chatting</span>
    </div>
    <div class="messages-container">
      <!-- Messages will be populated dynamically -->
    </div>
    <div class="message-input" style="display: none;">
      <textarea placeholder="Type a message..." id="message-text"></textarea>
      <button class="send-message" id="send-button">
        <i class="bx bx-send"></i> Send
      </button>

    </div>
  </div>
  <div class="online-use-list">
    <!-- Online users will be dynamically populated here -->
  </div>

</div>


<!-- Login/Register Section -->
<section class="login-section">
  <h2 class="section-title" id="form-title">Login</h2>
  <form id="auth-form" class="auth-form" method="POST">
    <div>
      <label for="usernameOrEmail">Username or Email:</label>
      <input type="text" id="usernameOrEmail" name="usernameOrEmail" required>
      <p class="error-message" id="error-usernameOrEmail" style="display: none;"></p>
    </div>
    <div>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
      <p class="error-message" id="error-password" style="display: none;"></p>
    </div>
    <p class="error-message" id="error-user" style="display: none;"></p>
    <button type="submit" class="submit-button" id="submit-button">Login</button>
  </form>

  <p class="toggle-link">Don't have an account? <a href="" id="toggle-auth" class="toggle-auth"
      data-target="register">Sign Up</a></p>
</section>


<!--Register Sestion-->
<section class="register-section">
  <h2 class="section-title">Register</h2>

  <form id="register-form" class="reg-form" method="POST" action="/register">
    <div>
      <label for="username">Username:</label>
      <input type="text" id="username" name="username"  class="reg-input"  required>
      <p class="error-message" id="error-username" style="display: none;"></p>
    </div>
    <div>
      <label for="firstName">First Name:</label>
      <input type="text" id="firstName" name="firstName"  class="reg-input"  required>
      <p class="error-message" id="error-firstName" style="display: none;"></p>
    </div>
    <div>
      <label for="lastName">Last Name:</label>
      <input type="text" id="lastName" name="lastName" class="reg-input"  required>
      <p class="error-message" id="error-lastName" style="display: none;"></p>
    </div>
    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email"  class="reg-input"  required>
      <p class="error-message" id="error-email" style="display: none;"></p>
    </div>
    <div>
      <label for="age">Age:</label>
      <input type="number" id="age" name="age"  class="reg-input" required>
      <p class="error-message" id="error-age"  style="display: none;"></p>
    </div>
    <div>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password"  class="reg-input"  required>
      <p class="error-message" id="error-password-p" style="display: none;"></p>
    </div>                               
    <div>
      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" name="confirmPassword"  class="reg-input"  required>
      <p class="error-message" id="error-confirmPassword" style="display: none;"></p>
    </div>
    <button type="submit" class="submit-button">Register</button>
  </form>

  <p class="toggle-link">Already have an account? 
    <a href="#" id="toggle-auth" class="toggle-auth" data-target="login">Sign In</a>
  </p>
</section>



<!-- Error Section -->
<section class="error-section" style="display: none;">
  <div class="error-container">
    <div class="opps">Oops!</div>
    <div class="error-code"></div>
    <div class="error-description"></div>
  </div>
</section>

<!-- Comment Section -->
<section class="post-details" style="display: none;">
  <!-- Copy content from comment.html here -->
</section>

</html>
