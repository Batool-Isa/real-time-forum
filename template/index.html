<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Forum</title>
    <link rel='stylesheet' type='text/css' media='screen' href='/assets/styles.css'>
</head>
<body>
     
<nav>
    <div class="container">
        <h2 class="logo">Real Time Forum</h2>
        <div>

            <button class="register-button">Register</button>
            <button class="login-button">Login</button>

    <button class="back-to-forum-button" style="display: none;">Back to Forum</button>
        </div>
        <div class="search-bar">
            <i class="uil uil-search"></i>
            <input
            type="text"
            placeholder="Search for creators, inspirations and projects"
          />
        </div>
        <div class="logout">
            <label class="btn btn-primary" for="logout">Logout</label>
            <div class="profile-pic">
                <img src="https://res.cloudinary.com/freecodez/image/upload/v1698067298/images/fy8azbqxhgdrbbijhipe.webp" alt="pic 1" />
            </div>
        </div>
    </div>
</nav>
    <!-- Home Page section -->
<main class="main">
    <div class="container" id="home-page">
        <aside class="left">
            <a class="profile">
                <div class="profile-pic">
                    <img src="https://res.cloudinary.com/freecodez/image/upload/v1698067298/images/fy8azbqxhgdrbbijhipe.webp" />
                </div>
                <div class="handle">
                    <h4>Freecodez</h4>
                    <p class="text-muted">@freecodez</p>
                </div>
            </a>
            <div class="sidebar">
                <a class="menu-item active">
                    <span><i class="uil uil-home"></i></span>
                    <h3>Home</h3>
                </a>
                <a class="menu-item">
                    <span><i class="uil uil-compass"></i></span>
                    <h3>Create Post</h3>
                </a>
            </div>
        </aside>
        <section class="middle">
            <!-- Create post section -->
            <div class="create-post">
                <h2 class="section-title">Create a New Post</h2>
                <form action="/create-post" method="post" class="create-post-form" id="create-post-form">
                    <div class="form-group">
                        <label for="post-content">Content:</label>
                        <textarea id="post-content" name="content" rows="10" minlength="1" maxlength="2500" style="white-space: pre-line" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="post-category">Category:</label>
                        <div id="post-category" class="checkbox-group">
                            <input type="checkbox" id="category-sports" name="category" value="Sports">
                            <label for="category-sports">Sports</label>
                            <input type="checkbox" id="category-technology" name="category" value="Technology">
                            <label for="category-technology">Technology</label>
                            <input type="checkbox" id="category-education" name="category" value="Education">
                            <label for="category-education">Education</label>
                            <input type="checkbox" id="category-health" name="category" value="Health">
                            <label for="category-health">Health</label>
                            <input type="checkbox" id="category-entertainment" name="category" value="Entertainment">
                            <label for="category-entertainment">Entertainment</label>
                            <input type="checkbox" id="category-travel" name="category" value="Travel">
                            <label for="category-travel">Travel</label>
                            <input type="checkbox" id="category-finance" name="category" value="Finance">
                            <label for="category-finance">Finance</label>
                            <input type="checkbox" id="category-culture" name="category" value="Culture">
                            <label for="category-culture">Culture</label>
                        </div>
                        <div id="error-message" style="color:red; display:none;">Please select at least one category.</div>
                    </div>
                    <button type="submit" class="submit-button">Create Post</button>
                </form>
            </div>
        
            <!-- Feeds section -->
            <article class="feeds">
                <!-- Posts will be dynamically inserted here -->
            </article>
        </section>
        
        <aside class="right">
            <div class="messages">
                <div class="heading">
                    <h4>Messages</h4>
                    <span><i class="uil uil-edit"></i></span>
                </div>
                <!-- Message items -->
                <div class="message">
                    <div class="profile-pic">
                        <img src="https://64.media.tumblr.com/2d678d77b051ee352d722d1f7fd2c029/88958e5f55a67155-7d/s250x400/74d69559d55329719bb0a50d8e9d77cbf0ec6da0.jpg" />
                        <div class="active"></div>
                    </div>
                    <div class="message-body">
                        <h5>Kareena Joshua</h5>
                        <p class="text-muted">Just woke up bruh..</p>
                    </div>
                </div>
            </div>
        </aside>
    
    <!-- Registration form section -->
<div id="register-section" style="display: none;">
    <h2>Register</h2>
    <form action="/register" method="POST">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div>
            <label for="confirm-password">Confirm Password:</label>
            <input type="confirm-password" id="confirm-password" name="confirm-password" required>
        </div>
        <div>
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required>
        </div>
        <div>
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required>
        </div>
        <div>
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select...</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>
        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required>
        </div>
        <button type="submit">Register</button>
    </form>
</div>

    <!-- Login form section -->
<div id="login-section" style="display: none;">
        <h2>Login</h2>
        <form action="/login" method="POST">
            <div>
                <label for="usernameOrEmail">Username:</label>
                <input type="text" id="username" name="usernameOrEmail" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

</main>

<script src='/assets/app.js'></script>
<script src='/assets/socket.js'></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        new UIController();
    });
 // Fetch and render posts in the feeds section
 async function fetchPosts() {
    try {
        const response = await fetch('/posts'); // Backend endpoint
        if (!response.ok) {
            throw new Error(`Failed to fetch posts: ${response.statusText}`);
        }

        const posts = await response.json();

        // Target the feeds container
        const feedsContainer = document.querySelector('.feeds');

        // Clear any existing content in the feeds container (optional)
        feedsContainer.innerHTML = '';

        // Loop through the posts and render each one
        posts.forEach((post) => {
            const postHTML = `
                <div class="feed" id="post-${post.postID}">
                    <div class="user">
                        <div class="profile-pic">
                            <img src="${post.profilePic || 'https://via.placeholder.com/150'}" alt="${post.username || 'User'}" />
                        </div>
                        <div class="info">
                            <h3>${post.username || 'Unknown User'}</h3>
                            <small>${new Date(post.createdAt || Date.now()).toLocaleString()}</small>
                        </div>
                    </div>
                    <div class="content">
                        <h4>${post.title || 'Untitled Post'}</h4>
                        <p>${post.postDescription || 'No description available.'}</p>
                    </div>
                    <div class="categories">
                        ${(post.categoryName || [])
                            .map((category) => `<span class="category">${category}</span>`)
                            .join(' ')}
                    </div>
                    <div class="actions">
                        <button class="like-button" data-post-id="${post.postID}">Like (<span class="like-count">${post.like || 0}</span>)</button>
                        <button class="dislike-button" data-post-id="${post.postID}">Dislike (<span class="dislike-count">${post.dislike || 0}</span>)</button>
                    </div>
                    <div class="comments">
                        <h5>Comments:</h5>
                        ${(post.comments || [])
                            .map(
                                (comment) => `
                                <div class="comment">
                                    <strong>${comment.username || 'Anonymous'}</strong>: ${comment.content || 'No comment'}
                                </div>
                            `
                            )
                            .join('')}
                    </div>
                </div>
            `;

            // Append the post to the feeds container
            feedsContainer.innerHTML += postHTML;
        });
    } catch (error) {
        console.error('Error fetching posts:', error);
    }
}

// Fetch posts on page load
document.addEventListener('DOMContentLoaded', fetchPosts);

</script>

</body>
</html>
